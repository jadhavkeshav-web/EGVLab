<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Graphics - Interactive Drawing Simulators</title>
<meta name="description" content="Interactive stepwise drawing simulators for Engineering Graphics: engineering curves, projection of lines, orthographic projection, isometric views and development of surfaces.">
<style>
  :root{
    --ink:#16344f; --ink-2:#2a5a86; --accent:#c96a2b;
    --line:#dfe5ec; --paper:#f4f6f9; --card:#ffffff; --muted:#6b7686;
    --bar:56px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:#16202b;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- top bar ---------- */
  header{
    flex:0 0 auto; background:var(--card);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 3px rgba(22,52,79,.06);
    display:flex; align-items:center; gap:18px;
    padding:0 16px; min-height:var(--bar);
  }
  .brand{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .brand svg{display:block;}
  .brand-text{line-height:1.15;}
  .brand-text b{display:block; font-size:.98rem; color:var(--ink); font-weight:700; letter-spacing:.2px;}
  .brand-text span{display:block; font-size:.73rem; color:var(--muted);}

  nav{
    flex:1 1 auto; display:flex; gap:6px; align-items:center;
    overflow-x:auto; scrollbar-width:thin;
  }
  nav::-webkit-scrollbar{height:6px;}
  nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .tab{
    flex:0 0 auto; position:relative;
    padding:8px 14px 9px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink);
    font:600 .875rem/1 inherit; font-family:inherit; cursor:pointer;
    white-space:nowrap;
  }
  .tab:hover{background:#eef2f7;}
  .tab:focus-visible{outline:2px solid var(--ink-2); outline-offset:2px;}
  .tab[aria-selected="true"]{
    background:var(--ink); border-color:var(--ink); color:#fff;
  }
  /* the one accent moment: active topic carries the drafting-orange rule */
  .tab[aria-selected="true"]::after{
    content:""; position:absolute; left:14px; right:14px; bottom:4px;
    height:2px; background:var(--accent); border-radius:2px;
  }

  .credit{
    flex:0 0 auto; font-size:.72rem; color:var(--muted); white-space:nowrap;
  }
  @media (max-width:1180px){ .credit{display:none;} }
  @media (max-width:640px){
    .brand-text span{display:none;}
    header{gap:12px; padding:0 10px;}
  }
  /* below this the wordmark crowds the topic tabs - keep the mark, drop the words */
  @media (max-width:560px){
    .brand-text{display:none;}
    header{gap:10px; padding:0 8px;}
    .tab{padding:8px 11px 9px; font-size:.83rem;}
  }

  /* ---------- stage ---------- */
  main{flex:1 1 auto; position:relative; min-height:0; background:var(--paper);}
  iframe{
    display:block; width:100%; height:100%; border:0; background:var(--paper);
  }
  #status{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:var(--paper); color:var(--muted); font-size:.9rem; text-align:center; padding:24px;
  }
  #status.show{display:flex;}
  #status b{color:var(--ink); font-size:1rem;}
  .spinner{
    width:26px; height:26px; border:2.5px solid var(--line);
    border-top-color:var(--ink-2); border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){
    .spinner{animation:none; border-top-color:var(--line);}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <!-- set-square: the instrument the whole suite imitates -->
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M3 22.2 L22.2 22.2 L3 3 Z" fill="none" stroke="#16344f" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M3 15.6 L9.6 22.2" fill="none" stroke="#c96a2b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <b>Engineering Graphics</b>
      <span>Interactive drawing simulators</span>
    </div>
  </div>

  <nav id="tabs" role="tablist" aria-label="Topics"></nav>

  <div class="credit">&copy; 2026 Prof. K. M. Jadhav &middot; All rights reserved</div>
</header>

<main>
  <iframe id="stage" title="Selected topic" allowfullscreen></iframe>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
(function(){
  "use strict";

  var TOPICS = [
    { id:"curves",      label:"Engineering Curves",       file:"EngineeringCurves_App.html" },
    { id:"lines",       label:"Projection of Lines",      file:"LineProblems_App.html" },
    { id:"orthographic",label:"Orthographic Projection",  file:"OrthographicProjection_App.html" },
    { id:"isometric",   label:"Isometric View",           file:"IsometricView_App.html" },
    { id:"development", label:"Development of Surfaces",  file:"DevelopmentOfSurfaces_App.html" }
  ];

  var nav    = document.getElementById("tabs");
  var stage  = document.getElementById("stage");
  var status = document.getElementById("status");
  var current = null;
  var settled = false;

  function showStatus(html){ status.innerHTML = html; status.classList.add("show"); }
  function hideStatus(){ status.classList.remove("show"); }

  // Build the tab strip
  TOPICS.forEach(function(t){
    var b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.id = "tab-" + t.id;
    b.textContent = t.label;
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected","false");
    b.addEventListener("click", function(){ go(t.id, true); });
    nav.appendChild(b);
  });

  var tabEls = Array.prototype.slice.call(nav.querySelectorAll(".tab"));

  // Roving arrow-key navigation across the tab strip
  nav.addEventListener("keydown", function(e){
    var i = tabEls.indexOf(document.activeElement);
    if(i < 0) return;
    var n = null;
    if(e.key === "ArrowRight") n = (i + 1) % tabEls.length;
    else if(e.key === "ArrowLeft") n = (i - 1 + tabEls.length) % tabEls.length;
    else if(e.key === "Home") n = 0;
    else if(e.key === "End") n = tabEls.length - 1;
    if(n === null) return;
    e.preventDefault();
    tabEls[n].focus();
    go(TOPICS[n].id, true);
  });

  function go(id, push){
    var idx = TOPICS.map(function(t){ return t.id; }).indexOf(id);
    if(idx < 0) idx = 0;
    var t = TOPICS[idx];
    if(current === t.id) return;
    current = t.id;

    tabEls.forEach(function(b, i){
      var on = (i === idx);
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    });

    // On narrow screens the strip scrolls, so bring the active topic into view.
    if(tabEls[idx].scrollIntoView){
      try{
        tabEls[idx].scrollIntoView({
          inline:"nearest", block:"nearest",
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
        });
      }catch(err){ tabEls[idx].scrollIntoView(); }
    }

    document.title = t.label + " - Engineering Graphics";
    stage.setAttribute("title", t.label);

    settled = false;
    showStatus('<div class="spinner"></div><div>Loading ' + t.label + '…</div>');
    stage.src = t.file;

    // If the file is missing or blocked, say so plainly instead of hanging.
    window.setTimeout(function(){
      if(!settled) showStatus(
        '<b>' + t.label + ' could not be opened</b>' +
        '<div>Check that <code>' + t.file + '</code> sits in the same folder as this page.</div>' +
        '<div>Opening this page straight from the file system can also block it - ' +
        'serve the folder over http, or upload it to your host.</div>'
      );
    }, 12000);

    if(push){
      if(history.replaceState) history.replaceState(null, "", "#" + t.id);
      else location.hash = t.id;
    }
  }

  stage.addEventListener("load", function(){
    // A blank src fires load too; ignore that case.
    if(!stage.getAttribute("src")) return;
    settled = true;
    hideStatus();
  });

  window.addEventListener("hashchange", function(){
    go((location.hash || "").replace(/^#/, ""), false);
  });

  go((location.hash || "").replace(/^#/, ""), true);
})();
</script>
</body>
</html>
